<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form.io PDF Render Harness</title>

    <!--
        Self contained render harness for the .NET PDF engine.

        It mirrors app/html/previewPage.html so the PDF matches the Preview page, and every
        asset is served by the engine's request interceptor (ChromiumPdfEngine.cs):
            /app/*    -> PdfRenderer:AppAssetsPath   (FormBuilderJs/app)
            /dist/*   -> PdfRenderer:AssetsPath      (FormBuilderJs/dist, rebuilt by the frontend build)
            /engine/* -> PdfRenderer:EnginePath      (this folder)
        Nothing is fetched from the internet, so rendering works on an offline server.
    -->
    <link rel="stylesheet" href="/app/vendor/bootswatch-flatly/bootstrap.min.css">
    <link rel="stylesheet" href="/dist/{{FORMIO_STYLESHEET}}">
    <link rel="stylesheet" href="/app/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/app/css/Formio_Template.css">
    <link rel="stylesheet" href="/app/styles.css">

    <style>
        /*
         * Print styles. Declared after the Preview page stylesheets so they can neutralise
         * the app-shell rules in app/styles.css (which put the body into a 100vh grid)
         * without touching any Form.io or Bootstrap styling.
         *
         * There is deliberately no @page rule: Chromium's PrintToPDF owns the paper size and
         * margins (PdfPageOptions), and a CSS @page margin would fight the header/footer.
         */

        /* ------------------------------------------------------------------ page shell */

        html,
        body.pdf-body {
            display: block !important;
            width: 100% !important;
            height: auto !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: visible !important;
            background: #ffffff !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .pdf-documents {
            width: 100%;
        }

        /* ----------------------------------------------------------- document sections */

        .pdf-document {
            width: 100%;
            padding: 0 0 4px 0;
            box-sizing: border-box;
            break-after: page;
            page-break-after: always;
        }

        .pdf-document.pdf-document-last {
            break-after: auto;
            page-break-after: auto;
        }

        .pdf-document-header {
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            break-after: avoid;
            page-break-after: avoid;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .pdf-document-title {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #333333;
            letter-spacing: 0;
        }

        .pdf-document-meta {
            margin-top: 6px;
            font-size: 11px;
            color: #6c757d;
        }

        .pdf-document-meta .pdf-meta-item {
            margin-right: 16px;
            white-space: nowrap;
        }

        .pdf-render-error {
            padding: 15px;
            border-radius: 4px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        /* --------------------------------------------------------------- page breaking */

        /* Components that fit on one page are kept whole (measured in applyPageBreakRules). */
        .pdf-keep-together {
            break-inside: avoid !important;
            page-break-inside: avoid !important;
        }

        /* Components taller than a page flow naturally (large Data Grids / Tables). */
        .pdf-allow-break {
            break-inside: auto !important;
            page-break-inside: auto !important;
        }

        /* Never strand a heading or a panel/table header at the foot of a page. */
        h1, h2, h3, h4, h5, h6,
        .card-header,
        .panel-heading,
        legend,
        .formio-component label,
        thead {
            break-after: avoid;
            page-break-after: avoid;
        }

        thead {
            display: table-header-group;
        }

        tfoot {
            display: table-footer-group;
        }

        tr,
        .signature-pad,
        .formio-component-signature,
        .signature-pad-body,
        img {
            break-inside: avoid;
            page-break-inside: avoid;
        }

        /* ----------------------------------------------------------- Form.io adjustments */

        .formio-pdf-content .formio-form,
        .formio-pdf-content .formio-component {
            width: 100%;
            max-width: 100%;
        }

        /* Action buttons never belong in a printed submission. */
        .formio-pdf-content .formio-component-button,
        .formio-pdf-content .formio-component-submit,
        .formio-pdf-content button[type="submit"],
        .formio-pdf-content .btn-wizard-nav-next,
        .formio-pdf-content .btn-wizard-nav-previous,
        .formio-pdf-content .btn-wizard-nav-cancel,
        .formio-pdf-content .formio-errors,
        .formio-pdf-content .alert-danger,
        .formio-pdf-content [ref="buttonMessageContainer"],
        .formio-pdf-content .formio-component-tooltip,
        .formio-pdf-content .component-edit-container {
            display: none !important;
        }

        /* Disabled read-only controls must print as normal, high-contrast text. */
        .formio-pdf-content input,
        .formio-pdf-content textarea,
        .formio-pdf-content select,
        .formio-pdf-content .form-control,
        .formio-pdf-content .choices__inner {
            color: #212529 !important;
            background-color: #ffffff !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #212529 !important;
        }

        .formio-pdf-content input[disabled],
        .formio-pdf-content textarea[disabled],
        .formio-pdf-content select[disabled],
        .formio-pdf-content .form-control[disabled],
        .formio-pdf-content .form-control:disabled {
            background-color: #ffffff !important;
            border-color: #ced4da !important;
        }

        /* Textareas must grow instead of scrolling so no content is clipped. */
        .formio-pdf-content textarea {
            height: auto !important;
            min-height: 38px;
            overflow: visible !important;
            resize: none !important;
        }

        .pdf-flattened-value {
            display: block;
            min-height: 38px;
            white-space: pre-wrap;
            word-break: break-word;
            height: auto !important;
        }

        /* Collapsible content is expanded by the script below - keep it visible. */
        .formio-pdf-content .collapse,
        .formio-pdf-content .collapsing,
        .formio-pdf-content .card-body,
        .formio-pdf-content .panel-body {
            display: block !important;
            height: auto !important;
            visibility: visible !important;
            overflow: visible !important;
        }

        /* Grids and tables keep their borders and stay inside the printable width. */
        .formio-pdf-content table {
            width: 100% !important;
            max-width: 100% !important;
            border-collapse: collapse;
        }

        .formio-pdf-content .table-responsive {
            overflow: visible !important;
        }

        /* Images and signatures scale down instead of overflowing the page. */
        .formio-pdf-content img,
        .formio-pdf-content canvas,
        .formio-pdf-content .signature-pad-canvas {
            max-width: 100% !important;
            height: auto !important;
        }

        /* Anything Form.io hid conditionally stays hidden, exactly like the Preview page. */
        .formio-pdf-content .formio-hidden,
        .formio-pdf-content [ref="component"][hidden] {
            display: none !important;
        }

        /* ------------------------------------------------- PDF Tab Section Styling */

        /* Reduce tab title size by 30% (from h4 default 1.25rem to 0.875rem) */
        .pdf-tab-section .card-title {
            font-size: 0.875rem;
        }

        /* -------------------------------------------- AcroForm (fillable PDF) mode */

        /*
         * The AcroForm document renders the *editable* form (readOnly: false) so every
         * control prints with the same box the Preview page shows, and the post processor
         * then lays a transparent PDF form field exactly on top of it. Only the controls a
         * PDF reader could never operate are hidden here - everything else is untouched, so
         * the page still looks identical to the read-only PDF.
         */
        body.pdf-acroform .formio-pdf-content .formio-button-add-row,
        body.pdf-acroform .formio-pdf-content .formio-button-remove-row,
        body.pdf-acroform .formio-pdf-content [ref="datagrid-addRow"],
        body.pdf-acroform .formio-pdf-content [ref="removeRow"],
        body.pdf-acroform .formio-pdf-content .editgrid-table-column-operations,
        body.pdf-acroform .formio-pdf-content .editgrid-actions,
        body.pdf-acroform .formio-pdf-content .signature-pad-refresh {
            display: none !important;
        }

        /*
         * ...and the cells those buttons lived in. A Data Grid carries an extra "Add/Remove"
         * column plus an "Add Another" footer row; hiding only the button leaves the cell
         * behind, which prints as an empty column wedged against the table's right border and
         * an empty striped strip under the last row. Dropping the whole cell lets the real
         * columns fill the table, so it ends where its content ends.
         */
        body.pdf-acroform .formio-pdf-content .datagrid-table > thead > tr > th:has(.sr-only),
        body.pdf-acroform .formio-pdf-content .datagrid-table > tbody > tr > td:has(.formio-button-remove-row),
        body.pdf-acroform .formio-pdf-content .datagrid-table > tbody > tr > td:has(.formio-drag-button),
        body.pdf-acroform .formio-pdf-content .datagrid-table > tfoot {
            display: none !important;
        }


        /*
         * Dropdown chrome. A reader draws its own arrow on a combobox field, so the one
         * Form.io prints is a second arrow on the same box. The clear (x) button goes with it
         * - there is nothing for it to clear on a printed form.
         */
        body.pdf-acroform .formio-pdf-content .choices[data-type*="select-one"]::after,
        body.pdf-acroform .formio-pdf-content .choices__button {
            display: none !important;
        }

        body.pdf-acroform .formio-pdf-content select {
            -webkit-appearance: none !important;
            appearance: none !important;
            background-image: none !important;
        }

        /* An enabled control must print with the same flat box a disabled one does. */
        body.pdf-acroform .formio-pdf-content input,
        body.pdf-acroform .formio-pdf-content textarea,
        body.pdf-acroform .formio-pdf-content select,
        body.pdf-acroform .formio-pdf-content .choices__inner {
            box-shadow: none !important;
            outline: none !important;
        }

        /*
         * Page breaks in AcroForm mode are decided by the harness itself: paginate() measures
         * every block and forces a break before any block that would cross a page boundary,
         * then remembers the document offset each printed page starts at. That bookkeeping is
         * what puts the form fields on the right page, so Chromium must not move anything
         * afterwards - every "avoid" rule that fires shifts content the harness has already
         * placed, and a repeated table header occupies space on paper that does not exist in
         * the DOM. The rules below are the print heuristics declared further up; they stay
         * exactly as they are for the read-only submission PDF.
         */
        body.pdf-acroform .pdf-keep-together,
        body.pdf-acroform .pdf-allow-break,
        body.pdf-acroform h1,
        body.pdf-acroform h2,
        body.pdf-acroform h3,
        body.pdf-acroform h4,
        body.pdf-acroform h5,
        body.pdf-acroform h6,
        body.pdf-acroform .card-header,
        body.pdf-acroform .panel-heading,
        body.pdf-acroform legend,
        body.pdf-acroform .formio-component label,
        body.pdf-acroform thead,
        body.pdf-acroform tr,
        body.pdf-acroform img,
        body.pdf-acroform .signature-pad,
        body.pdf-acroform .formio-component-signature,
        body.pdf-acroform .signature-pad-body {
            break-inside: auto !important;
            page-break-inside: auto !important;
            break-after: auto !important;
            page-break-after: auto !important;
        }

        /* A repeated header row would push every following row down the printed page. */
        body.pdf-acroform thead {
            display: table-row-group !important;
        }

        /* Chromium may pull lines onto the next page to satisfy these; the harness cannot see it. */
        body.pdf-acroform .formio-pdf-content * {
            orphans: 1;
            widows: 1;
        }

        /*
         * Zero-height marker the harness inserts to start a new page (see prepareForcedBreak).
         * It must take up no room at all, or the page would start below where it was recorded.
         */
        .pdf-page-break {
            display: block !important;
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            break-after: page !important;
            page-break-after: always !important;
        }
    </style>
</head>
<body class="pdf-body">

<div id="pdfDocuments" class="pdf-documents"></div>

<script src="/app/jquery/jquery.min.js"></script>
<script src="/app/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/dist/{{FORMIO_SCRIPT}}"></script>

<script>
/**
 * Form.io Tabs flattener - isolated extension of the PDF renderer.
 *
 * A printed page has no tabs, and Form.io only shows the active one (the other panes are
 * in the DOM with an inline `display: none`). This module rewrites every Tabs component
 * into the tabs' contents laid out one after another, in order, so the PDF contains all of
 * them. Everything around a Tabs component keeps its original position.
 *
 *     Tabs (4)                 Tab 1 content
 *         Tab 1                Tab 2 content   <- page break if it does not fit
 *         Tab 2        ->      Tab 3 content
 *         Tab 3                Tab 4 content
 *         Tab 4
 *
 * The markup produced per tab mirrors Form.io's own flat tab template
 * (src/templates/bootstrap/tab/flat.ejs), so no new styling is needed.
 *
 * Nothing here runs when a form has no Tabs component - flatten() returns immediately and
 * the rendering pipeline behaves exactly as it did before.
 */
(function (global) {
    'use strict';

    var TABS_SELECTOR = '.formio-component-tabs';
    var PANEL_SELECTOR = '.formio-component-panel';

    var DEFAULTS = {
        // 'auto'   - a tab moves to the next page only when it does not fit (page break rules
        //            are applied later by the renderer, which measures every .card)
        // 'always' - every tab after the first starts on a new page
        pageBreak: 'auto',
        showTabTitles: true,
        settleDelayMs: 150
    };

    function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    /**
     * Wait for the next painted frame, but never block on it: requestAnimationFrame does
     * not fire in a hidden or background page, so a timeout always releases the wait.
     */
    function nextFrame() {
        return new Promise(function (resolve) {
            var settled = false;
            var finish = function () {
                if (!settled) {
                    settled = true;
                    resolve();
                }
            };

            try {
                requestAnimationFrame(function () { requestAnimationFrame(finish); });
            } catch (e) {
                finish();
            }

            setTimeout(finish, 50);
        });
    }

    function toArray(nodeList) {
        return Array.prototype.slice.call(nodeList);
    }

    function depthOf(element) {
        var depth = 0;
        while (element.parentElement) {
            depth++;
            element = element.parentElement;
        }
        return depth;
    }

    /**
     * Every Tabs component under root, deepest first so nested Tabs are flattened into
     * static markup before their parent is cloned.
     */
    function collectTabsElements(root) {
        return toArray(root.querySelectorAll(TABS_SELECTOR)).sort(function (a, b) {
            return depthOf(b) - depthOf(a);
        });
    }

    /** The Form.io component instance that owns this element, when it can be resolved. */
    function findTabsComponent(form, element) {
        var found = null;
        if (form && typeof form.everyComponent === 'function') {
            form.everyComponent(function (comp) {
                if (!found && comp && comp.component &&
                    comp.component.type === 'tabs' && comp.element === element) {
                    found = comp;
                }
            });
        }
        return found;
    }

    /** Direct tab panes of this Tabs component (never a nested component's panes). */
    function getPanes(element) {
        return toArray(element.querySelectorAll('[role="tabpanel"], .formio-tab-panel'))
            .filter(function (pane) { return pane.closest(TABS_SELECTOR) === element; });
    }

    function getLinks(element) {
        return toArray(element.querySelectorAll('.nav-tabs .nav-link, .nav-tabs a'))
            .filter(function (link) { return link.closest(TABS_SELECTOR) === element; });
    }

    function getTabLabel(comp, links, index) {
        var schema = comp && comp.component && comp.component.components;
        if (schema && schema[index] && schema[index].label) {
            return schema[index].label;
        }
        if (links[index] && links[index].textContent.trim()) {
            return links[index].textContent.trim();
        }
        return 'Tab ' + (index + 1);
    }

    /**
     * Activate a tab the way a user would, then let Form.io finish rendering it.
     */
    async function activateTab(comp, element, index, settleDelayMs) {
        var links = getLinks(element);

        if (comp && typeof comp.setTab === 'function') {
            comp.setTab(index);
        } else if (links[index]) {
            links[index].click();
        } else {
            // Last resort for a custom tab template: drive the inline display directly.
            getPanes(element).forEach(function (pane, paneIndex) {
                pane.style.display = paneIndex === index ? 'block' : 'none';
            });
        }

        await nextFrame();
        await delay(settleDelayMs);
    }

    /**
     * cloneNode copies attributes, not the live value/checked properties Form.io sets, so
     * the current state is written back into the markup before the pane is cloned.
     */
    function captureControlState(scope) {
        toArray(scope.querySelectorAll('input, textarea, select')).forEach(function (el) {
            try {
                if (el.tagName === 'SELECT') {
                    toArray(el.options).forEach(function (option) {
                        if (option.selected) {
                            option.setAttribute('selected', 'selected');
                        } else {
                            option.removeAttribute('selected');
                        }
                    });
                } else if (el.tagName === 'TEXTAREA') {
                    el.textContent = el.value;
                } else if (el.type === 'checkbox' || el.type === 'radio') {
                    if (el.checked) {
                        el.setAttribute('checked', 'checked');
                    } else {
                        el.removeAttribute('checked');
                    }
                } else {
                    el.setAttribute('value', el.value == null ? '' : el.value);
                }
            } catch (e) {
                // A control that rejects the attribute is not worth failing the PDF for.
            }
        });
    }

    /** A cloned canvas starts blank, so its bitmap is copied across. */
    function copyCanvasContent(source, clone) {
        var originals = source.querySelectorAll('canvas');
        var copies = clone.querySelectorAll('canvas');

        for (var i = 0; i < originals.length && i < copies.length; i++) {
            try {
                if (!originals[i].width || !originals[i].height) {
                    continue;
                }
                copies[i].width = originals[i].width;
                copies[i].height = originals[i].height;
                copies[i].getContext('2d').drawImage(originals[i], 0, 0);
            } catch (e) {
                // Tainted or unsupported canvas - leave the clone as it is.
            }
        }
    }

    /** True when the pane still holds a collapsed panel (Form.io omits its body entirely). */
    function hasCollapsedPanel(pane) {
        return toArray(pane.querySelectorAll(PANEL_SELECTOR)).some(function (panel) {
            return !panel.querySelector('.card-body, .panel-body');
        });
    }

    /**
     * Wrap one tab's content the way Form.io's own flat tab template does, so the flattened
     * output needs no extra styling.
     */
    function buildTabCard(label, paneClone, settings, isFirst) {
        var card = document.createElement('div');
        card.className = 'mb-2 card border pdf-tab-section';

        if (settings.pageBreak === 'always' && !isFirst) {
            card.style.breakBefore = 'page';
            card.style.pageBreakBefore = 'always';
        }

        if (settings.showTabTitles) {
            var header = document.createElement('div');
            header.className = 'card-header bg-default';
            var title = document.createElement('h4');
            title.className = 'mb-0 card-title';
            title.textContent = label;
            header.appendChild(title);
            card.appendChild(header);
        }

        // The pane already carries Form.io's "card-body" class; only the tab specific
        // classes and the inline display toggle have to go.
        paneClone.classList.remove('tab-pane', 'formio-tab-panel', 'formio-tab-panel-active', 'active');
        paneClone.removeAttribute('role');
        paneClone.removeAttribute('ref');
        paneClone.style.display = '';
        if (!paneClone.classList.contains('card-body')) {
            paneClone.classList.add('card-body');
        }

        card.appendChild(paneClone);
        return card;
    }

    /**
     * Flatten every Tabs component under root.
     *
     * @param {Element}  root     Container holding the rendered form
     * @param {Object}   form     The Form.io form instance (used to drive setTab)
     * @param {Object}   options  { pageBreak, showTabTitles, settleDelayMs, expandCollapsed }
     * @returns {Object} { tabsFlattened, tabsRendered, errors }
     */
    async function flatten(root, form, options) {
        var settings = Object.assign({}, DEFAULTS, options || {});
        var result = { tabsFlattened: 0, tabsRendered: 0, errors: [] };

        if (!root) {
            return result;
        }

        var tabsElements = collectTabsElements(root);
        if (!tabsElements.length) {
            // No Tabs component: leave the rendering pipeline untouched.
            return result;
        }

        for (var t = 0; t < tabsElements.length; t++) {
            var tabsElement = tabsElements[t];

            // A nested Tabs component may already have been absorbed into a parent's clone.
            if (!tabsElement.parentNode) {
                continue;
            }

            try {
                var comp = findTabsComponent(form, tabsElement);
                var paneCount = getPanes(tabsElement).length;

                if (!paneCount) {
                    continue;
                }

                var flattenedTabs = document.createElement('div');
                flattenedTabs.className = 'pdf-tabs-flattened';

                for (var i = 0; i < paneCount; i++) {
                    await activateTab(comp, tabsElement, i, settings.settleDelayMs);

                    // Re-read after activation: Form.io may have re-rendered the pane.
                    var pane = getPanes(tabsElement)[i];
                    if (!pane) {
                        continue;
                    }

                    // A panel collapsed inside this tab has no body in the DOM, so there
                    // would be nothing to clone. Re-run the renderer's own expansion pass
                    // now that the tab is visible.
                    if (typeof settings.expandCollapsed === 'function' && hasCollapsedPanel(pane)) {
                        await settings.expandCollapsed();
                        await delay(settings.settleDelayMs);
                        pane = getPanes(tabsElement)[i] || pane;
                    }

                    captureControlState(pane);

                    var paneClone = pane.cloneNode(true);
                    copyCanvasContent(pane, paneClone);

                    var label = getTabLabel(comp, getLinks(tabsElement), i);
                    flattenedTabs.appendChild(buildTabCard(label, paneClone, settings, i === 0));
                    result.tabsRendered++;
                }

                tabsElement.parentNode.replaceChild(flattenedTabs, tabsElement);
                result.tabsFlattened++;
            } catch (e) {
                result.errors.push('tabs:' + (e && e.message ? e.message : e));
            }
        }

        return result;
    }

    global.FormPdfTabs = {
        flatten: flatten,
        hasTabs: function (root) { return !!(root && root.querySelector(TABS_SELECTOR)); },
        version: '1.0.0'
    };
})(window);
</script>

<script>
/**
 * Form.io PDF renderer.
 *
 * The .NET engine navigates here, waits for window.FormPdfRenderer, then calls
 * window.FormPdfRenderer.render(payloadJson) and waits for the returned promise before
 * calling Chromium's PrintToPDF.
 *
 * Schema normalisation and submission extraction intentionally mirror app/js/preview.js so
 * the PDF matches the Preview page.
 */
(function (global) {
    'use strict';

    var DEFAULT_OPTIONS = {
        expandCollapsible: true,
        showDocumentTitle: true,
        showSubmissionMeta: true,
        flattenInputs: false,
        usablePageHeightPx: 970,
        settleDelayMs: 400,
        assetTimeoutMs: 15000,
        // Tabs flattening (see the FormPdfTabs module above)
        tabPageBreak: 'auto',
        showTabTitles: true
    };

    var diagnostics = { documents: 0, expanded: 0, tabs: 0, tabSections: 0, errors: [] };

    function delay(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /**
     * Normalise a form schema coming from /api/forms/{id}.
     * Mirrors initializePreview() in app/js/preview.js.
     */
    function normalizeSchema(rawSchema) {
        var formSchema = rawSchema;

        if (typeof formSchema === 'string') {
            formSchema = JSON.parse(formSchema);
        }

        // Some callers wrap the schema in a "form" property.
        if (formSchema && formSchema.form && typeof formSchema.form === 'object') {
            formSchema = formSchema.form;
        }

        // The .NET backend stores components as a JSON string on FormDto.
        if (formSchema.components && typeof formSchema.components === 'string') {

            '.formio-component-container',
            '.formio-component-datagrid',
            '.formio-component-editgrid',
            '.formio-component-table',

        });
    }

    /**
     * Pin the vertical layout the harness just measured, so printing cannot reflow it.
     *
     * Chromium measures text about 2% wider on screen than it does when printing (it rounds
     * glyph advances for the screen and not for paper). A line of text that only just wraps
     * in the DOM therefore fits on one line on paper, its row prints a line-height shorter,
     * and every field below it on that page slides up by that much.
     *
     * Writing each measured height back as a min-height makes the printed row keep the height
     * it was measured at - the text still prints on one line, it simply sits in a box that no
     * longer collapses. Nothing moves when the values are applied, because every element is
     * given exactly the height it already has.
     */
    function freezeHeights(root) {
        var frozen = 0;

        toArray(root.querySelectorAll('*')).forEach(function (element) {
            var style = window.getComputedStyle(element);
            var display = style.display;

            // min-height does not apply to table internals or to inline boxes.
            if (display === 'none' || display === 'inline' || display.indexOf('table-') === 0) {
                return;
            }

            var height = element.getBoundingClientRect().height;
            if (height <= 0) {
                return;
            }

            // getBoundingClientRect reports the border box; min-height sizes the content box
            // unless the element is border-box, so the difference has to come off.
            if (style.boxSizing !== 'border-box') {
                height -= (parseFloat(style.paddingTop) || 0) + (parseFloat(style.paddingBottom) || 0) +
                    (parseFloat(style.borderTopWidth) || 0) + (parseFloat(style.borderBottomWidth) || 0);
            }

            if (height > 0) {
                element.style.minHeight = height + 'px';
                frozen++;
            }
        });

        return frozen;
    }

    // ============================================================================ pagination

    /**
     * Decide where every printed page starts and force those breaks, so a DOM offset can be
     * translated into "page N, this far down".
     *
     * Blocks are visited in document order. A block that no longer fits on the current page
     * is pushed to the next one with `break-before: page`; because CSS fragmentation leaves
     * DOM geometry untouched, that block's own document offset is the offset Chromium will
     * print at the top of the new page. Blocks taller than a page are opened up and their
     * children are considered instead.
     *
     * @returns {Array} [{ startY }] - document offset (CSS px) each printed page starts at
     */
    function paginate(root, options) {
        var pageHeight = options.pageHeightPx;
        var safety = Math.max(0, options.pageBreakSafetyPx);
        var pages = [{ startY: 0 }];
        var cursor = { start: 0 };

        walk(root, 0);
        return pages;

        function startPage(startY) {
            cursor.start = startY;
            pages.push({ startY: startY });
        }

        /** @returns {Boolean} true when this element's children could be broken up */
        function walk(element, depth) {
            // Form.io nests deeply (container > panel > card > body > row > column > ...) and a
            // level the walk refuses to open is a level whose page breaks it has to guess, so
            // this is only a guard against a pathological tree, not a real limit.
            if (depth > 60) {
                return false;
            }

            if (!canBreakBetweenChildrenOf(element)) {
                return false;
            }

            // Snapshot: the loop only adds inline styles, never nodes, so this stays valid.
            var children = toArray(element.children);

            for (var i = 0; i < children.length; i++) {
                var child = children[i];
                var style = window.getComputedStyle(child);

                if (style.display === 'none' || style.visibility === 'hidden') {
                    continue;
                }
                if (style.position === 'absolute' || style.position === 'fixed') {
                    continue;
                }
                if ((style.cssFloat || style.float || 'none') !== 'none') {
                    continue;
                }

                var rect = child.getBoundingClientRect();
                if (rect.height <= 0) {
                    continue;
                }

                var top = rect.top + scrollTop() - state.docTop;
                var bottom = top + rect.height;

                // Anything starting past the current page belongs to a later one. Only
                // reachable after an oversized block was fragmented by Chromium itself.
                while (top >= cursor.start + pageHeight) {
                    startPage(cursor.start + pageHeight);
                }

                if (bottom <= cursor.start + pageHeight - safety) {
                    continue;
                }

                if (rect.height > pageHeight - safety) {
                    // Taller than a page: break it open, or - if it cannot be broken open -
                    // let Chromium fragment it at the regular page interval.
                    if (!child.children.length || !walk(child, depth + 1)) {
                        while (cursor.start + pageHeight < bottom) {
                            startPage(cursor.start + pageHeight);
                        }
                    }
                    continue;
                }

                var previous = previousInFlowSibling(child);
                var spaceAbove = previous
                    ? top - (previous.getBoundingClientRect().bottom + scrollTop() - state.docTop)
                    : (parseFloat(style.marginTop) || 0);

                if (top - spaceAbove <= cursor.start) {
                    // Would produce an empty page - leave it to Chromium.
                    continue;
                }

                startPage(prepareForcedBreak(child, root));
            }

            return true;
        }
    }

    // ====================================================================== field collection

    /**
     * Walk the rendered form and describe every control as a PDF form field, already
     * positioned in PDF points.
     */
    function collectFields(root, options) {
        var content = root.querySelector('.formio-pdf-content') || root;
        var fields = [];
        var usedNames = Object.create(null);

        // --- dropdowns -----------------------------------------------------------------
        // Form.io renders most Select components through Choices.js, where the <select> is
        // hidden and a wrapper div is what the reader actually sees.
        toArray(content.querySelectorAll('select')).forEach(function (select) {
            if (isIgnored(select)) {
                return;
            }

            var box = visibleBoxFor(select);
            var rect = box.getBoundingClientRect();
            if (!isMeasurable(rect, 10)) {
                return;
            }

            var seen = Object.create(null);
            var choices = [];
            toArray(select.options).forEach(function (option) {
                var text = (option.text || option.value || '').trim();
                if (!text || seen[text]) {
                    return;
                }
                seen[text] = true;
                choices.push(text);
            });

            fields.push({
                kind: 'dropdown',
                name: uniqueName(select, usedNames),
                options: choices,
                multiple: !!select.multiple,
                required: isRequired(select),
                fontSize: fontSizeFor(box, options),
                widgets: [toWidget(rect, options)]
            });
        });

        // --- radio groups --------------------------------------------------------------
        // Every radio sharing a name is one PDF radio group with one widget per option.
        var groups = [];
        var groupsByName = Object.create(null);

        toArray(content.querySelectorAll('input[type="radio"]')).forEach(function (input) {
            if (isIgnored(input)) {
                return;
            }
            var rect = input.getBoundingClientRect();
            if (!isMeasurable(rect, 4)) {
                return;
            }

            var key = input.name || ('radio-' + groups.length);
            var group = groupsByName[key];
            if (!group) {
                group = groupsByName[key] = {
                    element: input,
                    values: Object.create(null),
                    widgets: [],
                    required: isRequired(input)
                };
                groups.push(group);
            }

            var widget = toWidget(rect, options);
            widget.value = uniqueValue(group.values, input.value, group.widgets.length);
            group.widgets.push(widget);
        });

        groups.forEach(function (group) {
            if (!group.widgets.length) {
                return;
            }
            fields.push({
                kind: 'radio',
                name: uniqueName(group.element, usedNames),
                required: group.required,
                widgets: group.widgets
            });
        });

        // --- checkboxes ----------------------------------------------------------------
        // Covers the Checkbox component and every option of Select Boxes / Survey.
        toArray(content.querySelectorAll('input[type="checkbox"]')).forEach(function (input) {
            if (isIgnored(input)) {
                return;
            }
            var rect = input.getBoundingClientRect();
            if (!isMeasurable(rect, 4)) {
                return;
            }

            fields.push({
                kind: 'checkbox',
                name: uniqueName(input, usedNames),
                required: isRequired(input),
                widgets: [toWidget(rect, options)]
            });
        });

        // --- single line text ----------------------------------------------------------
        toArray(content.querySelectorAll('input')).forEach(function (input) {
            var type = (input.getAttribute('type') || 'text').toLowerCase();
            if (!TEXT_INPUT_TYPES[type] || isIgnored(input)) {
                return;
            }
            var rect = input.getBoundingClientRect();
            if (!isMeasurable(rect, 10)) {
                return;
            }

            fields.push({
                kind: 'text',
                name: uniqueName(input, usedNames),
                required: isRequired(input),
                fontSize: fontSizeFor(input, options),
                widgets: [toWidget(rect, options)]
            });
        });

        // --- textareas -----------------------------------------------------------------
        toArray(content.querySelectorAll('textarea')).forEach(function (textarea) {
            if (isIgnored(textarea)) {
                return;
            }
            var rect = textarea.getBoundingClientRect();
            if (!isMeasurable(rect, 10)) {
                return;
            }

            fields.push({
                kind: 'multiline',
                name: uniqueName(textarea, usedNames),
                required: isRequired(textarea),
                fontSize: fontSizeFor(textarea, options),
                widgets: [toWidget(rect, options)]
            });
        });

        // --- signatures ----------------------------------------------------------------
        // The signature pad becomes a real PDF signature field over the same box, so a
        // reader offers its signing tool there - drawn, typed or an image - instead of the
        // plain line of text a text field would give.
        toArray(content.querySelectorAll('.formio-component-signature')).forEach(function (component) {
            var pad = component.querySelector('.signature-pad-body') ||
                component.querySelector('canvas');
            if (!pad) {
                return;
            }
            var rect = pad.getBoundingClientRect();
            if (!isMeasurable(rect, 12)) {
                return;
            }

            var carrier = component.querySelector('input[name]') || pad;
            fields.push({
                kind: 'signature',
                name: uniqueName(carrier, usedNames),
                widgets: [toWidget(rect, options)]
            });
        });

        return fields;
    }

    /** Controls that can never become a usable PDF field. */
    function isIgnored(element) {
        var type = (element.getAttribute('type') || '').toLowerCase();
        if (IGNORED_INPUT_TYPES[type]) {
            return true;
        }
        // Choices.js clones a search box into the dropdown; it is not part of the form.
        if (element.classList.contains('choices__input--cloned')) {
            return true;
        }
        return !!element.closest(
            '.formio-component-button, .formio-component-hidden, .btn, .pagination, ' +
            '.choices__list, .formio-component-content, .formio-component-htmlelement');
    }

    /** Choices.js hides the real <select>; the reader sees the wrapper. */
    function visibleBoxFor(select) {
        var choices = select.closest('.choices');
        if (choices) {
            return choices.querySelector('.choices__inner') || choices;
        }
        return select;
    }

    function isMeasurable(rect, minSize) {
        return rect.width >= minSize && rect.height >= minSize;
    }

    function isRequired(element) {
        return element.required === true || element.getAttribute('aria-required') === 'true';
    }

    /** Match the on-screen text size so typing into the PDF looks like the printed form. */
    function fontSizeFor(element, options) {
        var size = parseFloat(window.getComputedStyle(element).fontSize);
        if (!size || isNaN(size)) {
            size = 14;
        }
        size = size * PT_PER_PX * options.scale;
        return Math.round(Math.min(16, Math.max(5, size)) * 10) / 10;
    }

    /**
     * Form.io names its inputs data[firstName], data[address][city] or data[grid][0][key].
     * Flatten that into a PDF friendly, unique field name - '.' is left out on purpose,
     * because PDF reads it as a field hierarchy separator.
     */
    function uniqueName(element, usedNames) {
        var raw = element.getAttribute('name') || element.getAttribute('id') || 'field';
        var name = raw
            .replace(/^data/, '')
            .replace(/[^A-Za-z0-9_-]+/g, '_')
            .replace(/_+/g, '_')
            .replace(/^_+|_+$/g, '');

        if (!name) {
            name = 'field';
        }

        var candidate = name;
        var suffix = 2;
        while (usedNames[candidate]) {
            candidate = name + '_' + suffix;
            suffix++;
        }
        usedNames[candidate] = true;
        return candidate;
    }

    /** Export values of a radio group have to be distinct and non empty. */
    function uniqueValue(used, value, index) {
        var candidate = String(value == null || value === '' ? 'option_' + (index + 1) : value);
        var suffix = 2;
        while (used[candidate]) {
            candidate = value + '_' + suffix;
            suffix++;
        }
        used[candidate] = true;
        return candidate;
    }

    /**
     * Translate a DOM rectangle into a position on a printed page.
     * Distances become points measured from the page's top-left corner; pdf-lib flips them
     * onto its bottom-left origin in place(), where the real page height is known.
     */
    function toWidget(rect, options) {
        var top = rect.top + scrollTop() - state.docTop;
        var left = rect.left + scrollLeft() - state.docLeft;
        var page = pageIndexOf(top);
        var factor = PT_PER_PX * options.scale;

        return {
            page: page,
            x: options.marginLeftPt + left * factor,
            yTop: options.marginTopPt + (top - state.pages[page].startY) * factor,
            width: rect.width * factor,
            height: rect.height * factor
        };
    }

    function pageIndexOf(top) {
        var index = 0;
        for (var i = 0; i < state.pages.length; i++) {
            // Half a pixel of slack: a block forced onto a page sits exactly on its start.
            if (top + 0.5 >= state.pages[i].startY) {
                index = i;
            } else {
                break;
            }
        }
        return index;
    }

    // ============================================================== post processing (pdf-lib)

    /**
     * Entry point invoked by AcroFormContentSource.PostProcessAsync, once Chromium has
     * printed. Adds a transparent PDF form field over every control measured by render().
     *
     * @param {String} base64Pdf the printed document
     * @returns {Object} { ok, pdf, fields, pdfPages, warnings } or { ok: false, error }
     */
    async function apply(base64Pdf) {
        try {
            var options = state.options || DEFAULTS;
            await loadPdfLib(options.pdfLibUrl || DEFAULTS.pdfLibUrl);

            var lib = global.PDFLib;
            var document_ = await lib.PDFDocument.load(base64ToBytes(base64Pdf), {
                ignoreEncryption: true,
                updateMetadata: false
            });

            var form = document_.getForm();
            var pages = document_.getPages();
            var warnings = [];
            var added = 0;

            var transparent = options.transparentFields !== false;

            state.fields.forEach(function (field) {
                try {
                    added += addField(lib, document_, form, pages, field, transparent);
                } catch (e) {
                    warnings.push('field ' + field.name + ': ' + (e && e.message ? e.message : e));
                }
            });

            if (!transparent) {
                // Let the reader build its own appearances, so the field chrome shows up even
                // in viewers that ignore the streams pdf-lib generates. Deliberately not set
                // in transparent mode: rebuildAppearances() below writes a correct - and
                // empty - appearance for every field, and NeedAppearances only invites a
                // viewer to draw its own idea of a form field on top of the printed one.
                try {
                    form.acroForm.dict.set(lib.PDFName.of('NeedAppearances'), lib.PDFBool.True);
                } catch (e) {
                    warnings.push('needAppearances: ' + (e && e.message ? e.message : e));
                }
            }

            try {
                if (transparent) {
                    await rebuildAppearances(lib, document_, form);
                } else {
                    form.updateFieldAppearances();
                }
            } catch (e) {
                warnings.push('appearances: ' + (e && e.message ? e.message : e));
            }

            var bytes = await document_.save({ updateFieldAppearances: false });

            return {
                ok: true,
                pdf: bytesToBase64(bytes),
                fields: added,
                pdfPages: pages.length,
                warnings: warnings
            };
        } catch (e) {
            return { ok: false, error: (e && e.message) ? e.message : String(e) };
        }
    }

    function addField(lib, document_, form, pages, field, transparent) {
        var pdfField = null;
        var placed = 0;

        if (field.kind === 'signature') {
            return addSignatureField(lib, document_, form, pages, field);
        }

        if (field.kind === 'radio') {
            pdfField = form.createRadioGroup(field.name);
            field.widgets.forEach(function (widget) {
                var target = place(pages, widget);
                if (!target) {
                    return;
                }
                pdfField.addOptionToPage(widget.value, target.page, target.rect);
                placed++;
            });

            if (!placed) {
                return 0;
            }
        } else {
            var target = place(pages, field.widgets[0]);
            if (!target) {
                return 0;
            }

            if (field.kind === 'dropdown') {
                pdfField = form.createDropdown(field.name);
                if (field.options && field.options.length) {
                    pdfField.addOptions(field.options);
                }
                if (field.multiple) {
                    trySilently(function () { pdfField.enableMultiselect(); });
                }
                pdfField.addToPage(target.page, target.rect);
            } else if (field.kind === 'checkbox') {
                pdfField = form.createCheckBox(field.name);
                pdfField.addToPage(target.page, target.rect);
            } else {
                pdfField = form.createTextField(field.name);
                if (field.kind === 'multiline') {
                    pdfField.enableMultiline();
                }
                pdfField.addToPage(target.page, target.rect);
            }

            placed = 1;
        }

        // The font size lives in the field's /DA entry, which addToPage is what writes.
        if (field.fontSize && typeof pdfField.setFontSize === 'function') {
            trySilently(function () { pdfField.setFontSize(field.fontSize); });
        }
        // A reader with field highlighting on draws a red box around every required field,
        // which is the one piece of chrome the document itself can still switch off. The
        // printed label keeps its asterisk either way.
        if (field.required && !transparent) {
            trySilently(function () { pdfField.enableRequired(); });
        }

        // Nothing is ever marked read-only. A control the form disables is still printed as a
        // box on the page, and a box on a printed form is there to be filled in - so it gets
        // the same editable field as every other control.

        styleWidgets(lib, pdfField, transparent);
        return placed;
    }

    /**
     * A signature pad becomes a real PDF signature field (/FT /Sig) rather than a text field,
     * so a reader offers its signing tool over that box - Acrobat lets the signature be drawn,
     * typed or loaded from an image - instead of a single line of typed text.
     *
     * Built from the raw dictionary because pdf-lib has no signature field API. It is given
     * an empty appearance stream so it paints nothing over the printed pad; note that readers
     * still lay their own "sign here" tab on top of an unsigned signature field, which is
     * viewer chrome the document cannot switch off.
     */
    function addSignatureField(lib, document_, form, pages, field) {
        var target = place(pages, field.widgets[0]);
        if (!target) {
            return 0;
        }

        var rect = target.rect;
        var context = document_.context;

        var appearance = context.register(context.flateStream('', {
            Type: 'XObject',
            Subtype: 'Form',
            FormType: 1,
            BBox: [0, 0, rect.width, rect.height],
            Resources: {}
        }));

        var widget = context.obj({
            Type: 'Annot',
            Subtype: 'Widget',
            FT: 'Sig',
            Rect: [rect.x, rect.y, rect.x + rect.width, rect.y + rect.height],
            T: lib.PDFString.of(field.name),
            F: 4,                       // print the annotation
            P: target.page.ref,
            BS: { W: 0, S: 'S' },
            Border: [0, 0, 0],
            AP: { N: appearance }
        });

        var ref = context.register(widget);
        target.page.node.addAnnot(ref);
        form.acroForm.addField(ref);
        return 1;
    }

    /**
     * Flip a widget onto pdf-lib's bottom-left origin and keep it inside the sheet.
     * borderWidth 0 plus the /MK removal in styleWidgets() is what leaves the printed
     * control visible underneath.
     */
    function place(pages, widget) {
        if (!pages.length) {
            return null;
        }

        var index = Math.min(Math.max(widget.page, 0), pages.length - 1);
        var page = pages[index];
        var size = page.getSize();

        var width = Math.max(widget.width, 6);
        var height = Math.max(widget.height, 6);
        var x = Math.min(Math.max(widget.x, 0), Math.max(size.width - width, 0));
        var y = Math.min(Math.max(size.height - widget.yTop - height, 0), Math.max(size.height - height, 0));

        return { page: page, rect: { x: x, y: y, width: width, height: height, borderWidth: 0 } };
    }

    /**
     * Strip everything a widget would paint of its own accord.
     *
     * pdf-lib gives every widget a white background and a black border through the /MK
     * appearance characteristics dictionary. On top of that, a widget with neither /BS nor
     * /Border falls back to the PDF default border of one unit. Removing all three leaves the
     * field with nothing to draw, so the only thing on the page is the control Chromium
     * printed - exactly what the Preview page shows.
     */
    function styleWidgets(lib, field, transparent) {
        if (!transparent) {
            return;
        }

        trySilently(function () {
            field.acroField.getWidgets().forEach(function (widget) {
                var context = widget.dict.context;
                widget.dict.delete(lib.PDFName.of('MK'));
                widget.dict.set(lib.PDFName.of('BS'), context.obj({ W: 0, S: 'S' }));
                widget.dict.set(lib.PDFName.of('Border'), context.obj([0, 0, 0]));
            });
        });
    }

    /**
     * Rebuild every appearance stream now that /MK is gone.
     *
     * This is not optional. pdf-lib writes a widget's appearance when the field is added to
     * the page - while /MK still exists - so the stream already contains "fill this rectangle
     * white". Deleting /MK afterwards does not touch it, and form.updateFieldAppearances()
     * regenerates only the fields it considers dirty, which a freshly created field is not.
     * The result would be an opaque white rectangle sitting on top of every printed control.
     *
     * Calling each field's own generator directly sidesteps that bookkeeping: with no /MK to
     * read, the provider emits the path but no paint operator, and a checked box or selected
     * radio draws just its tick or dot.
     */
    async function rebuildAppearances(lib, document_, form) {
        // Text fields and dropdowns need a font to lay their (currently empty) value out with;
        // checkboxes and radio groups ignore the extra argument.
        var font = await document_.embedFont(lib.StandardFonts.Helvetica);

        form.getFields().forEach(function (field) {
            trySilently(function () { field.defaultUpdateAppearances(font); });
        });

        blankOffAppearances(lib, document_, form);
    }

    /**
     * Blank the "off" appearance of every checkbox and radio button.
     *
     * Regenerating gets rid of their white background but not of their outline: pdf-lib's
     * provider hard-codes a black border colour, and it strokes the path at width 0 - which
     * PDF defines as the thinnest line the device can draw, not as nothing. An unchecked box
     * would therefore still lay a hairline square, and a radio a hairline circle, on top of
     * the one Chromium printed.
     *
     * Only the off state is emptied. The on state keeps its stream, so ticking a box or
     * choosing a radio still draws the mark.
     */
    function blankOffAppearances(lib, document_, form) {
        var context = document_.context;
        var off = lib.PDFName.of('Off');

        form.getFields().forEach(function (field) {
            trySilently(function () {
                field.acroField.getWidgets().forEach(function (widget) {
                    var appearances = context.lookup(widget.dict.get(lib.PDFName.of('AP')));
                    if (!appearances || typeof appearances.get !== 'function') {
                        return;
                    }

                    var normal = context.lookup(appearances.get(lib.PDFName.of('N')));
                    // A text field's normal appearance is one stream; a checkbox or radio has
                    // a dictionary of states, which is the only case with an off state.
                    if (!normal || typeof normal.get !== 'function' ||
                        typeof normal.getUnencodedContents === 'function') {
                        return;
                    }

                    var current = context.lookup(normal.get(off));
                    if (!current) {
                        return;
                    }

                    normal.set(off, context.register(context.flateStream('', {
                        Type: 'XObject',
                        Subtype: 'Form',
                        FormType: 1,
                        BBox: current.dict.get(lib.PDFName.of('BBox')),
                        Resources: {}
                    })));
                });
            });
        });
    }

    function trySilently(action) {
        try {
            action();
        } catch (e) {
            // A viewer-specific nicety failing is never worth losing the whole PDF over.
        }
    }

    /** Loaded on demand, so the read-only PDF path never pays for the 0.5 MB bundle. */
    function loadPdfLib(url) {
        if (global.PDFLib) {
            return Promise.resolve();
        }
        if (pdfLibPromise) {
            return pdfLibPromise;
        }

        pdfLibPromise = new Promise(function (resolve, reject) {
            var script = document.createElement('script');
            script.src = url;
            script.onload = function () {
                if (global.PDFLib) {
                    resolve();
                } else {
                    reject(new Error('pdf-lib loaded from ' + url + ' but window.PDFLib is missing'));
                }
            };
            script.onerror = function () {
                reject(new Error('Could not load pdf-lib from ' + url));
            };
            document.head.appendChild(script);
        });

        return pdfLibPromise;
    }

    function base64ToBytes(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
    }

    function bytesToBase64(bytes) {
        // String.fromCharCode blows the argument limit on a whole document, so chunk it.
        var chunkSize = 0x8000;
        var parts = [];
        for (var i = 0; i < bytes.length; i += chunkSize) {
            parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize)));
        }
        return btoa(parts.join(''));
