<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.6.2/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/builder.css">
    <link rel="stylesheet" href="../css/userProfile.css">
    <link rel="stylesheet" href="../css/userDetails.css">

    <!-- Page guard: requires a signed-in session before this page renders. -->
    <script src="../js/auth.js"></script>
</head>
<body>

<div class="menu-overlay" id="menuOverlay"></div>

<!-- Navigation Header -->
<div class="profile-nav">
    <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <i class="bi bi-list"></i>
    </button>
    <h2>User Details</h2>
</div>

<!-- Tabs Navigation -->
<div style="display: flex; justify-content: center;">
    <div class="tabs-container" style="max-width: 1100px;">
        <a href="userProfile.html" class="tab-link">User Profile</a>
        <!-- <a href="login.html" class="tab-link">Admin Settings</a> -->
        <a href="userDetails.html" class="tab-link active">User Details</a>
    </div>
</div>

<!-- Main Centered Layout Wrapper -->
<div class="profile-page-container">
    <div class="wireframe-card">
        
        <!-- Controls: Search, Sort, Add Button -->
        <div class="controls-row">
            <div class="search-sort-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search users..." onkeyup="filterUsers()">
                <select id="sortSelect" class="sort-select" onchange="sortUsers()">
                    <option value="">Sort by:</option>
                    <option value="a-z">A - Z</option>
                    <option value="z-a">Z - A</option>
                    <option value="new-old">New - Old</option>
                    <option value="old-new">Old - New</option>
                </select>
            </div>
            <button class="btn-add-user" onclick="addNewUser()">
                <i class="bi bi-plus"></i> Add New User
            </button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Users will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" id="paginationContainer">
            <!-- Pagination buttons will be populated here -->
        </div>
        <div class="pagination-info" id="paginationInfo"></div>

    </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <div class="modal-header">Edit Row</div>
        
        <div class="modal-form-group">
            <label class="modal-label">Username:</label>
            <input type="text" class="modal-input" id="editUsername" placeholder="Enter username">
        </div>

        <div class="modal-form-group">
            <label class="modal-label">Full Name:</label>
            <input type="text" class="modal-input" id="editFullName" placeholder="Enter full name">
        </div>

        <div class="modal-form-group">
            <label class="modal-label">Role:</label>
            <select class="modal-select" id="editRole">
                <option value="Developer">Developer</option>
                <option value="Manager">Manager</option>
                <option value="Analyst">Analyst</option>
                <option value="Designer">Designer</option>
                <option value="Admin">Admin</option>
            </select>
        </div>

        <div class="modal-buttons">
            <button class="modal-btn-cancel" onclick="cancelEdit()">Cancel</button>
            <button class="modal-btn-save" onclick="saveEdit()">Save</button>
        </div>
    </div>
</div>

<!--
    Add New User Modal.

    Two faces in one dialog: the form, and - once the account exists - the generated
    password. The second one is not a nicety: the API stores only the hash, so that
    screen is the only place the password is ever readable.

    All of its behaviour lives in js/userDetailsHandler.js.
-->
<div class="modal-overlay" id="addUserModal">
    <div class="modal-content">

        <!-- Face 1: the form -->
        <div id="addUserFormSection">
            <div class="modal-header">Add New User</div>

            <div class="modal-error" id="addUserError" style="display: none;"></div>

            <div class="modal-form-group">
                <label class="modal-label" for="addUserFirstName">First Name:</label>
                <input type="text" class="modal-input" id="addUserFirstName" placeholder="Enter first name" autocomplete="off">
            </div>

            <div class="modal-form-group">
                <label class="modal-label" for="addUserLastName">Last Name:</label>
                <input type="text" class="modal-input" id="addUserLastName" placeholder="Enter last name" autocomplete="off">
            </div>

            <div class="modal-form-group">
                <label class="modal-label" for="addUserUserName">Username:</label>
                <div class="input-with-button">
                    <input type="text" class="modal-input" id="addUserUserName" placeholder="Enter username" autocomplete="off">
                    <button type="button" class="btn-verify" id="btnVerifyUserName">Verify</button>
                </div>
                <div class="username-feedback" id="userNameFeedback"></div>
            </div>

            <div class="modal-form-group">
                <label class="modal-label" for="addUserEmail">Email:</label>
                <input type="email" class="modal-input" id="addUserEmail" placeholder="Enter email address" autocomplete="off">
            </div>

            <div class="modal-form-group">
                <label class="modal-label">Role:</label>
                <!-- Multi-select: an account can hold more than one role at a time. -->
                <div class="role-dropdown" id="roleDropdown">
                    <button type="button" class="role-dropdown-toggle" id="roleDropdownToggle">
                        <span class="role-dropdown-label placeholder" id="roleDropdownLabel">Select role(s)</span>
                        <i class="bi bi-chevron-down"></i>
                    </button>
                    <!-- Options are fetched from GET /api/users/roles, never hard-coded here. -->
                    <div class="role-dropdown-menu" id="roleDropdownMenu"></div>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn-cancel" id="btnCancelAddUser">Cancel</button>
                <button class="modal-btn-save" id="btnSaveNewUser">Save</button>
            </div>
        </div>

        <!-- Face 2: the one-time password -->
        <div id="newUserPasswordSection" style="display: none;">
            <div class="modal-header">User Created</div>

            <div class="new-user-summary">
                <div><span>Name</span><strong id="newUserSummaryName"></strong></div>
                <div><span>Username</span><strong id="newUserSummaryUserName"></strong></div>
                <div><span>Email</span><strong id="newUserSummaryEmail"></strong></div>
                <div><span>Role(s)</span><strong id="newUserSummaryRoles"></strong></div>
            </div>

            <div class="modal-form-group">
                <label class="modal-label">Temporary Password:</label>
                <div class="password-reveal">
                    <code id="newUserPasswordValue"></code>
                    <button type="button" class="btn-verify" id="btnCopyNewUserPassword">Copy</button>
                </div>
                <div class="password-warning">
                    <i class="bi bi-exclamation-triangle"></i>
                    Copy this now - it is stored only as a hash and cannot be shown again.
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn-save" id="btnCloseNewUserPassword">Done</button>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="../js/CommonItems.js"></script>
<script src="../js/FormBuilderApi.js"></script>
<script src="../js/userDetailsHandler.js"></script>

<script>
    const ITEMS_PER_PAGE = 5;
    let currentPage = 1;
    let filteredUsers = [];
    let editingUserId = null;

    // Rows come from GET /api/users (AspNetUsers). This is the loaded copy the table
    // renders, searches and sorts against, and it is replaced wholesale on every reload.
    let allUsers = [];

    function loadUsersTable() {
        showTableMessage('Loading users...');

        FormBuilderApi.getUsers(
            function (users) {
                allUsers = (users || []).map(toTableRow);
                filteredUsers = [...allUsers];
                currentPage = 1;

                if (!allUsers.length) {
                    showTableMessage('No users found');
                    return;
                }

                renderTable();
            },
            function (error) {
                allUsers = [];
                filteredUsers = [];
                showTableMessage(error, true);
            }
        );
    }

    /**
     * The API's user shape mapped onto what this table already renders. `role` is a
     * joined list because an account can now hold more than one.
     */
    function toTableRow(user) {
        return {
            id: user.userId,
            username: user.userName,
            firstName: user.firstName || '',
            lastName: user.lastName || '',
            email: user.email || '',
            role: (user.roles || []).join(', '),
            created: user.created
        };
    }

    function showTableMessage(message, isError) {
        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML =
            `<tr><td colspan="4" class="table-message${isError ? ' error' : ''}">${escapeHtml(message)}</td></tr>`;

        document.getElementById('paginationContainer').innerHTML = '';
        document.getElementById('paginationInfo').textContent = '';
    }

    /**
     * These rows are real account data now, not a fixed demo array, so anything
     * interpolated into the table's HTML has to be escaped first.
     */
    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text == null ? '' : text).replace(/[&<>"']/g, m => map[m]);
    }

    function renderTable() {
        const tableBody = document.getElementById('usersTableBody');
        tableBody.innerHTML = '';

        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const end = start + ITEMS_PER_PAGE;
        const pageUsers = filteredUsers.slice(start, end);

        pageUsers.forEach(user => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${escapeHtml(user.username)}</td>
                <td>${escapeHtml((user.firstName + ' ' + user.lastName).trim())}</td>
                <td>${escapeHtml(user.role)}</td>
                <td class="actions-cell">
                    <button class="btn-action btn-edit" onclick="editUser('${escapeHtml(user.id)}')">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button class="btn-action btn-delete" onclick="deleteUser('${escapeHtml(user.id)}')">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredUsers.length / ITEMS_PER_PAGE);
        const paginationContainer = document.getElementById('paginationContainer');
        const paginationInfo = document.getElementById('paginationInfo');
        
        paginationContainer.innerHTML = '';

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
            btn.textContent = i;
            btn.onclick = () => {
                currentPage = i;
                renderTable();
            };
            paginationContainer.appendChild(btn);
        }

        const start = (currentPage - 1) * ITEMS_PER_PAGE + 1;
        const end = Math.min(currentPage * ITEMS_PER_PAGE, filteredUsers.length);
        paginationInfo.textContent = `Showing ${start} to ${end} of ${filteredUsers.length} users`;
    }

    function filterUsers() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        filteredUsers = allUsers.filter(user => 
            user.firstName.toLowerCase().includes(searchTerm) ||
            user.lastName.toLowerCase().includes(searchTerm) ||
            user.username.toLowerCase().includes(searchTerm) ||
            user.role.toLowerCase().includes(searchTerm)
        );
        currentPage = 1;
        renderTable();
    }

    function sortUsers() {
        const sortValue = document.getElementById('sortSelect').value;
        if (sortValue === 'a-z') {
            filteredUsers.sort((a, b) => (a.firstName + a.lastName).localeCompare(b.firstName + b.lastName));
        } else if (sortValue === 'z-a') {
            filteredUsers.sort((a, b) => (b.firstName + b.lastName).localeCompare(a.firstName + a.lastName));
        } else if (sortValue === 'new-old') {
            filteredUsers.sort((a, b) => new Date(b.created) - new Date(a.created));
        } else if (sortValue === 'old-new') {
            filteredUsers.sort((a, b) => new Date(a.created) - new Date(b.created));
        }
        currentPage = 1;
        renderTable();
    }

    function editUser(userId) {
        const user = allUsers.find(u => u.id === userId);
        if (user) {
            editingUserId = userId;
            document.getElementById('editUsername').value = user.username;
            document.getElementById('editFullName').value = user.firstName + ' ' + user.lastName;
            document.getElementById('editRole').value = user.role;
            document.getElementById('editModal').classList.add('active');
        }
    }

    function cancelEdit() {
        document.getElementById('editModal').classList.remove('active');
        editingUserId = null;
    }

    function saveEdit() {
        if (!editingUserId) return;

        const user = allUsers.find(u => u.id === editingUserId);
        if (user) {
            const fullName = document.getElementById('editFullName').value.trim().split(' ');
            user.username = document.getElementById('editUsername').value.trim();
            user.firstName = fullName[0] || '';
            user.lastName = fullName.slice(1).join(' ') || '';
            user.role = document.getElementById('editRole').value;

            cancelEdit();
            renderTable();
        }
    }

    function deleteUser(userId) {
        if (confirm('Are you sure you want to delete this user?')) {
            const index = allUsers.findIndex(u => u.id === userId);
            if (index > -1) {
                allUsers.splice(index, 1);
                filteredUsers = filteredUsers.filter(u => u.id !== userId);
                currentPage = 1;
                renderTable();
            }
        }
    }

    function addNewUser() {
        UserDetailsHandler.openAddUserDialog();
    }

    // Load table on page load
    document.addEventListener('DOMContentLoaded', function () {
        // The dialog reloads the table itself once an account has been created, so a
        // new user appears without the admin having to refresh.
        UserDetailsHandler.init({ onUserCreated: loadUsersTable });

        loadUsersTable();
    });

    // Close modal when clicking outside
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) {
            cancelEdit();
        }
    });
</script>

</body>
</html>
