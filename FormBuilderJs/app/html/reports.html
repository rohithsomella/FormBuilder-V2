<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reports</title>
    <link id="themeStylesheet"
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@4.6.2/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/formio.full.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../css/existingForms.css">
    <link rel="stylesheet" href="../css/builder.css">

    <style>
        #submissionsTable tbody tr {
            cursor: pointer;
            user-select: none;
        }

        #submissionsTable tbody tr:hover {
            background-color: #e9ecef !important;
        }

        /* ---- PDF job queue ribbons (bottom right, this page only) ---- */

        #pdfJobQueue {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1080; /* above the report modal */
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none; /* clicks pass through the empty container */
        }

        .pdf-job {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
            max-width: 340px;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.3;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
            background: rgba(52, 152, 219, .14);
            border: 1px solid rgba(52, 152, 219, .45);
            color: #1b4f7a;
            animation: pdf-job-in .22s ease-out;
            transition: background-color .25s ease, border-color .25s ease, color .25s ease;
        }

        .pdf-job[data-state="done"] {
            background: rgba(24, 188, 156, .16);
            border-color: rgba(24, 188, 156, .55);
            color: #0f6b5a;
        }

        .pdf-job[data-state="failed"] {
            background: rgba(231, 76, 60, .14);
            border-color: rgba(231, 76, 60, .55);
            color: #a13226;
        }

        .pdf-job.pdf-job-leaving {
            animation: pdf-job-out .25s ease-in forwards;
        }

        .pdf-job-icon {
            font-size: 16px;
            flex: 0 0 auto;
        }

        .pdf-job[data-state="running"] .pdf-job-icon {
            animation: pdf-job-hourglass 1.6s ease-in-out infinite;
        }

        .pdf-job-body {
            flex: 1 1 auto;
            min-width: 0;
        }

        .pdf-job-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pdf-job-meta {
            opacity: .85;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pdf-job-close {
            flex: 0 0 auto;
            border: 0;
            background: transparent;
            color: inherit;
            opacity: .6;
            font-size: 18px;
            line-height: 1;
            padding: 0 2px;
            cursor: pointer;
        }

        .pdf-job-close:hover {
            opacity: 1;
        }

        @keyframes pdf-job-hourglass {
            0%, 35%   { transform: rotate(0deg); }
            50%, 85%  { transform: rotate(180deg); }
            100%      { transform: rotate(360deg); }
        }

        @keyframes pdf-job-in {
            from { opacity: 0; transform: translateX(24px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes pdf-job-out {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(24px); }
        }
    </style>

</head>
<body>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="builder-navbar">
    <div class="header-left">
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" data-toggle="tooltip" data-placement="bottom" title="Menu">
            <i class="bi bi-list"></i>
        </button>
        <h2 id="pageHeading">Reports</h2>
    </div>

    <div class="menu-buttons"></div>

</div>

<div id="reportsContent" class="forms-list-container">
    <div class="forms-wrapper">
        <div id="reportsLoadingMessage" class="alert alert-info">
            <i class="bi bi-info-circle"></i> <strong>Loading forms...</strong>
        </div>
        
        <!-- Search and Filter Controls -->
        <div class="table-controls" id="tableControls" style="display: none;">
            <div class="controls-left">
                <input type="text" id="searchInput" class="search-box" placeholder="Search forms..." />
                <select id="filterSelect" class="filter-dropdown">
                    <option value="">Sort by:</option>
                    <option value="name-asc">A - Z</option>
                    <option value="name-desc">Z - A</option>
                    <option value="date-desc">New - Old</option>
                    <option value="date-asc">Old - New</option>
                </select>
            </div>
        </div>
        
        <table id="reportsTable" class="table table-striped table-hover" style="display: none;">
            <thead class="table-dark">
                <tr>
                    <th>Form Name</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="reportsTableBody">
            </tbody>
        </table>
        
        <!-- Pagination Controls -->
        <div class="pagination-controls" id="paginationControls" style="display: none;">
            <div class="pagination-buttons">
                <button class="pagination-btn" id="prevPageBtn" onclick="FormBuilderApi.previousPage()">&lt; Previous</button>
                <div class="page-numbers" id="pageNumbers"></div>
                <button class="pagination-btn" id="nextPageBtn" onclick="FormBuilderApi.nextPage()" style="display: none;">More &gt;</button>
            </div>
            <div class="pagination-info">
                <span id="paginationInfo">Page 1</span>
            </div>
        </div>
    </div>
</div>

<!-- Report Dialog Modal -->
<div class="modal fade" id="reportModal" tabindex="-1" role="dialog" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reportModalLabel">Form Name</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="reportLoadingMessage" class="alert alert-info" style="display: none;">
                    <i class="bi bi-hourglass-split"></i> <strong>Loading submissions...</strong>
                </div>
                <div id="reportErrorMessage" class="alert alert-danger" style="display: none;"></div>
                <table id="submissionsTable" class="table table-striped table-hover" style="display: none;">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 50px;">
                                <input type="checkbox" id="selectAllCheckbox" title="Select all submissions">
                            </th>
                            <th>Submission ID</th>
                            <th>Version</th>
                            <th>Submission Date</th>
                            <th>Modified Date</th>
                            <th style="width: 50px; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTableBody">
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="exportJsonBtn">
                    <i class="bi bi-download"></i> Export to Json
                </button>
                <button type="button" class="btn btn-primary" id="exportCsvBtn">
                    <i class="bi bi-download"></i> Export CSV
                </button>
                <button type="button" class="btn btn-primary" id="downloadPdfBtn">
                    <i class="bi bi-file-pdf"></i> Download as PDF
                </button>
            </div>
        </div>
    </div>
</div>

<!-- PDF generation queue - one ribbon per background job -->
<div id="pdfJobQueue" aria-live="polite" aria-atomic="false"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/formio.full.js"></script>
<script src="../js/CommonItems.js"></script>
<script src="../js/main.js"></script>
<script src="../js/FormBuilderApi.js"></script>
<script src="../js/reports.js"></script>

</body>
</html>
